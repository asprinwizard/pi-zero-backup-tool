[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "p2backup"
dynamic = ["version"]
description = "Back up Panasonic P2 cards on a Raspberry Pi Zero 2 W"
requires-python = ">=3.11"
dependencies = ["pillow"]

[project.optional-dependencies]
# On the Pi these come from apt (see install/steps/s10_packages.py).
pi = ["gpiozero", "lgpio", "spidev", "smbus2", "pyudev", "xxhash"]
dev = ["pytest>=8", "ruff>=0.5", "pillow"]

[tool.setuptools.dynamic]
version = { attr = "p2backup.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
